# Bambu Lab X2D – picture-elements-dashboard (YAML-läge)
# Bakgrund: /config/www/X2D/bakgrund_v2_1920.jpg (1920 x 1326 px, nedskalad för plattan;
#   originalet bakgrund_v2.jpg är 3840 x 2651 – positionerna är i procent och gäller båda)
#   v2 är samma scen som gamla bakgrund.png (3840 x 1857) men 397 px högre upptill;
#   ramarna sitter 397 px längre ner och ram E/F är bredare (x 2581–3421).
# Positioner: procent av bildens bredd/höjd, uppmätta mot ramarnas kanter.
# Storlekar/text: cqw (procent av bildens egen bredd) så allt skalar med bilden.
# Textelement ritas 5x för stora och krymps med scale(0.2). Annars tvingar
# Android-webbvyns minsta teckenstorlek (8 px) upp den lilla texten så att den
# överlappar. Därför är alla mått nedan 5x referensmåtten.
# Stil kopierad från /config/X2D/Referens (färger och proportioner uppmätta).
#
# Färger
#   rubrik     #F3F4F8   underrad  #75787D   etikett (ljus) #E3E1E2   etikett (grå) #808487
#   ruta       #2A2C2C   kant aktiv #46624F  kant av #3A3D3F
#   grönt (aktivt/OK) #4CD685   blått (info) #4FB3E6   rött (fel) #FF5A5A   grått (av) #8A8F94

kiosk_mode:
  hide_header: true
  mobile_settings:
    custom_width: 1300
    hide_header: true
    hide_sidebar: true

title: X2D
views:
  - title: X2D
    path: x2d
    type: panel
    background: "#000"
    cards:
      - type: picture-elements
        image: /local/X2D/bakgrund_v2_1920.jpg?v=1
        card_mod:
          style: |
            ha-card {
              background: #000;
              border: none;
              border-radius: 0;
              box-shadow: none;
              overflow: hidden;
              height: 100vh;
              height: 100dvh;
              display: flex;
              align-items: center;
              justify-content: center;
            }
            /* Bakgrunden beskärs för att fylla skärmen (som object-fit: cover),
               centrerad. Taket på beskärningen gör att rutorna (x 10–89 %,
               y 18–82 % av bilden) alltid syns: högst 18 % av bredden och
               32 % av höjden får skäras bort. Vid extrema format blir det
               svarta kanter i stället för avklippta rutor. */
            #root {
              flex: none;
              width: min(max(100%, calc(100vh * 1.4485)), calc(100% / 0.82), calc(100vh * 1.4485 / 0.68));
              width: min(max(100%, calc(100dvh * 1.4485)), calc(100% / 0.82), calc(100dvh * 1.4485 / 0.68));
              container-type: inline-size;
            }
        elements:
          # ============================================================
          # HEM-KNAPP (sidhuvud/sidomeny är dolda med kiosk-mode)
          # ============================================================
          - type: icon
            icon: mdi:home
            title: Till startsidan
            tap_action:
              action: navigate
              navigation_path: /lovelace
            style: {left: "max(2.2cqw, calc(50% - 50vw + 2.2cqw))", top: "max(2.2cqw, calc(50% - 50dvh + 2.2cqw))"}  # följer synliga hörnet även när bilden beskärs
            card_mod:
              style: |
                :host {
                  --mdc-icon-size: 1.2cqw;
                  color: #8A8F94;
                  background: rgba(42, 44, 44, 0.85);
                  border-radius: 50%;
                  padding: 0.35cqw;
                }

          # ============================================================
          # RAM B – TEMPERATURER (x 913–1318 px, y 944–1314 px)
          # Rubrik och underrad ritas som text via card-mod (title-fältet).
          # ============================================================
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: TEMPERATURER
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 29.05%, top: 36.89%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "TEMPERATURER";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 3.6cqw; font-weight: 900; letter-spacing: 0.15cqw;
                  color: #F3F4F8; white-space: nowrap;
                }
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: X2D · MÅLTEMPERATURER
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 29.05%, top: 38.36%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "X2D · MÅLTEMPERATURER";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 1.6cqw; font-weight: 700; letter-spacing: 0.2cqw;
                  color: #75787D; white-space: nowrap;
                }

          # Temperaturruta (som referensen): etikett (title), måltemp stort, aktuell smått.
          # Aktuell temperatur visas stort i etiketterna på skrivarbilden.
          # Målentiteten härleds från entiteten: *_temperature -> *_target_temperature
          - type: state-label
            entity: sensor.sovrum_x2d_left_nozzle_temperature
            title: MUNSTYCKE V
            style: {left: 26.59%, top: 41.83%, width: 23.2%, height: 23.01%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: &temptile |
                {% set v = states(config.entity) %}
                {% set ok = v not in ['unavailable', 'unknown'] %}
                {% set t = states(config.entity | replace('_temperature', '_target_temperature')) | float(0) %}
                :host {
                  display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 0.6cqw;
                  box-sizing: border-box;
                  background: #2A2C2C;
                  border: 5px solid {{ '#FF5A5A' if not ok else ('#46624F' if t > 0 else '#3A3D3F') }};
                  border-radius: 1.7cqw;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0;
                  line-height: 1;
                }
                :host::before {
                  content: "{{ config.title }}";
                  font-size: 2.0cqw; font-weight: 700; letter-spacing: 0.05cqw;
                  color: #E3E1E2; white-space: nowrap;
                }
                div { padding: 0; font-size: 0; }
                div::after {
                  content: "{{ t | round(0) | int ~ '°C' if ok else '--' }}";
                  font-size: 4.4cqw; font-weight: 800;
                  color: {{ '#FF5A5A' if not ok else ('#4CD685' if t > 0 else '#E3E1E2') }};
                  white-space: nowrap;
                }
                :host::after {
                  content: "AKTUELL {{ (v | float(0)) | round(0) | int ~ '°C' if ok else '--' }}";
                  font-size: 1.75cqw; font-weight: 700; letter-spacing: 0.05cqw;
                  color: #A9ADB1; white-space: nowrap;
                }
          - type: state-label
            entity: sensor.sovrum_x2d_right_nozzle_temperature
            title: MUNSTYCKE H
            style: {left: 31.51%, top: 41.83%, width: 23.2%, height: 23.01%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *temptile
          - type: state-label
            entity: sensor.sovrum_x2d_bed_temperature
            title: BÄDD
            style: {left: 26.59%, top: 46.96%, width: 23.2%, height: 23.01%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *temptile
          - type: state-label
            entity: sensor.sovrum_x2d_chamber_temperature
            title: KAMMARE
            style: {left: 31.51%, top: 46.96%, width: 23.2%, height: 23.01%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *temptile

          # ============================================================
          # RAM H – MASKINSTATUS (x 1307–2148 px, y 1844–2159 px)
          # Rubriken är vänsterställd som i referensen (origin vänsterkant).
          # ============================================================
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: MASKINSTATUS
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 34.64%, top: 71.04%, transform: "translate(0, -50%) scale(0.2)", transform-origin: "left center"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "MASKINSTATUS";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 3.6cqw; font-weight: 900; letter-spacing: 0.15cqw;
                  color: #F3F4F8; white-space: nowrap;
                }
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: X2D · SYSTEMSTATUS
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 34.64%, top: 72.3%, transform: "translate(0, -50%) scale(0.2)", transform-origin: "left center"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "X2D · SYSTEMSTATUS";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 1.6cqw; font-weight: 700; letter-spacing: 0.2cqw;
                  color: #75787D; white-space: nowrap;
                }

          # Statusruta: etikett (title) + tolkat värde. Färg: grönt OK/aktivt,
          # blått info, rött fel, grått av/okänt.
          - type: state-label
            entity: binary_sensor.sovrum_x2d_online
            title: SKRIVARE
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 37.12%, top: 74.88%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: &stattile |
                {% set e = config.entity %}
                {% set s = states(e) %}
                {% set n = namespace(txt='--', c='grey') %}
                {% if s in ['unavailable', 'unknown'] %}
                {% elif e.endswith('_online') %}
                  {% set n.txt, n.c = ('ANSLUTEN', 'green') if s == 'on' else ('FRÅNKOPPLAD', 'red') %}
                {% elif e.endswith('_door') %}
                  {% set n.txt, n.c = ('ÖPPEN', 'blue') if s == 'on' else ('STÄNGD', 'green') %}
                {% elif e.startswith('light.') %}
                  {% set n.txt, n.c = ('PÅ', 'green') if s == 'on' else ('AV', 'grey') %}
                {% elif e.endswith('_hms_errors') %}
                  {% set cnt = state_attr(e, 'Count') | int(0) %}
                  {% set n.txt, n.c = ((cnt ~ ' FEL') if cnt > 0 else 'FEL', 'red') if s == 'on' else ('OK', 'green') %}
                {% elif e.endswith('_print_error') %}
                  {% set n.txt, n.c = ('FEL', 'red') if s == 'on' else ('OK', 'green') %}
                {% elif e.endswith('_airduct_mode') %}
                  {% set n.txt, n.c = ({'cooling': 'KYLNING', 'heating': 'VÄRMNING'}.get(s, s | upper), 'blue') %}
                {% elif e.endswith('_speed_profile') %}
                  {% set n.txt, n.c = ({'silent': 'TYST', 'standard': 'STANDARD', 'sport': 'SPORT', 'ludicrous': 'MAX'}.get(s, s | upper), 'blue') %}
                {% elif e.endswith('_print_status') %}
                  {% set m = {'running': ('SKRIVER UT', 'green'), 'prepare': ('FÖRBEREDER', 'green'),
                              'slicing': ('SLICAR', 'green'), 'init': ('STARTAR', 'green'),
                              'pause': ('PAUSAD', 'blue'), 'failed': ('MISSLYCKAD', 'red'),
                              'finish': ('KLAR', 'grey'), 'idle': ('INAKTIV', 'grey'),
                              'offline': ('FRÅNKOPPLAD', 'grey')} %}
                  {% set n.txt, n.c = m.get(s, (s | upper, 'grey')) %}
                {% endif %}
                {% set val = {'green': '#4CD685', 'blue': '#4FB3E6', 'red': '#FF5A5A', 'grey': '#8A8F94'}[n.c] %}
                {# Långa värden (t.ex. COOLING MODE) krymps så de ryms i rutan. #}
                {% set brd = {'green': '#46624F', 'blue': '#3E5B78', 'red': '#7A3A3A', 'grey': '#3A3D3F'}[n.c] %}
                :host {
                  display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 0.5cqw;
                  box-sizing: border-box;
                  background: #2A2C2C;
                  border: 5px solid {{ brd }};
                  border-radius: 1.7cqw;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0;
                  line-height: 1;
                  {{ 'cursor: pointer;' if e.startswith('light.') else '' }}
                }
                :host::before {
                  content: "{{ config.title }}";
                  font-size: 2.0cqw; font-weight: 700; letter-spacing: 0.05cqw;
                  color: #E3E1E2; white-space: nowrap;
                }
                div { padding: 0; font-size: 0; }
                div::after {
                  content: "{{ n.txt }}";
                  font-size: {{ [3.6, 20 / ((n.txt | length) * 0.7)] | min | round(2) }}cqw; font-weight: 800;
                  color: {{ val }};
                  white-space: nowrap;
                }
          - type: state-label
            entity: binary_sensor.sovrum_x2d_door
            title: LUCKA
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 42.35%, top: 74.88%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *stattile
          # Lampan är den enda styrbara rutan (tillåten enligt prompten).
          - type: state-label
            entity: light.sovrum_x2d_chamber_light
            title: LAMPA
            tap_action: {action: toggle}
            hold_action: {action: more-info}
            style: {left: 47.59%, top: 74.88%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *stattile
          - type: state-label
            entity: binary_sensor.sovrum_x2d_hms_errors
            title: HMS
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 52.83%, top: 74.88%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *stattile
          - type: state-label
            entity: binary_sensor.sovrum_x2d_print_error
            title: UTSKRIFTSFEL
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 37.12%, top: 78.96%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *stattile
          - type: state-label
            entity: sensor.sovrum_x2d_airduct_mode
            title: LUFTKANAL
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 42.35%, top: 78.96%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *stattile
          - type: state-label
            entity: sensor.sovrum_x2d_speed_profile
            title: HASTIGHET
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 47.59%, top: 78.96%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *stattile
          - type: state-label
            entity: sensor.sovrum_x2d_print_status
            title: STATUS
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 52.83%, top: 78.96%, width: 24.73%, height: 18%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *stattile

          # ============================================================
          # RAM A – ANSLUTNING (x 913–1318 px, y 470–842 px)
          # Rutor utan synlig kant och med grå etikett, som i referensen.
          # ============================================================
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: ANSLUTNING
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 29.05%, top: 19.08%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "ANSLUTNING";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 3.6cqw; font-weight: 900; letter-spacing: 0.15cqw;
                  color: #F3F4F8; white-space: nowrap;
                }
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: X2D · NÄTVERK & SYSTEM
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 29.05%, top: 20.05%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "X2D · NÄTVERK & SYSTEM";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 1.6cqw; font-weight: 700; letter-spacing: 0.2cqw;
                  color: #75787D; white-space: nowrap;
                }

          - type: state-label
            entity: binary_sensor.sovrum_x2d_online
            title: SKRIVARE
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 26.57%, top: 22.26%, width: 23.4%, height: 13.1%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: &conntile |
                {% set e = config.entity %}
                {% set s = states(e) %}
                {% set n = namespace(txt='--', c='grey') %}
                {% if s in ['unavailable', 'unknown'] %}
                {% elif e.endswith('_online') %}
                  {% set n.txt, n.c = ('ANSLUTEN', 'green') if s == 'on' else ('FRÅNKOPPLAD', 'red') %}
                {% elif e.endswith('_developer_lan_mode') %}
                  {% set n.txt, n.c = ('UTVECKLARE', 'green') if s == 'on' else ('AV', 'grey') %}
                {% elif e.endswith('_wi_fi_signal') %}
                  {% set n.txt, n.c = (s | int ~ ' dBm', 'blue') %}
                {% elif e.endswith('_sd_card_status') %}
                  {% set m = {'normal': ('NORMAL', 'green'), 'abnormal': ('FEL', 'red'), 'missing': ('INGET KORT', 'grey')} %}
                  {% set n.txt, n.c = m.get(s, (s | upper, 'grey')) %}
                {% elif e.endswith('_firmware') %}
                  {% set n.txt, n.c = ('UPPDATERA', 'blue') if s == 'on' else ('OK', 'green') %}
                {% elif e.endswith('_mqtt_connection_mode') %}
                  {% set n.txt, n.c = ('LOKAL', 'blue') if s == 'local' else ('MOLN', 'blue') %}
                {% endif %}
                {% set val = {'green': '#4CD685', 'blue': '#4FB3E6', 'red': '#FF5A5A', 'grey': '#8A8F94'}[n.c] %}
                :host {
                  display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 0.8cqw;
                  box-sizing: border-box;
                  background: #2A2C2C;
                  border: 5px solid {{ '#7A3A3A' if n.c == 'red' else '#2A2C2C' }};
                  border-radius: 1.7cqw;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0;
                  line-height: 1;
                }
                :host::before {
                  content: "{{ config.title }}";
                  font-size: 1.9cqw; font-weight: 700; letter-spacing: 0.1cqw;
                  color: #808487; white-space: nowrap;
                }
                div { padding: 0; font-size: 0; }
                div::after {
                  content: "{{ n.txt }}";
                  font-size: {{ [3.0, 19 / ((n.txt | length) * 0.7)] | min | round(2) }}cqw; font-weight: 800;
                  color: {{ val }};
                  white-space: nowrap;
                }
          - type: state-label
            entity: binary_sensor.sovrum_x2d_developer_lan_mode
            title: LAN-LÄGE
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 31.54%, top: 22.26%, width: 23.4%, height: 13.1%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *conntile
          - type: state-label
            entity: sensor.sovrum_x2d_wi_fi_signal
            title: WI-FI
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 26.57%, top: 25.37%, width: 23.4%, height: 13.1%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *conntile
          - type: state-label
            entity: sensor.sovrum_x2d_sd_card_status
            title: SD-KORT
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 31.54%, top: 25.37%, width: 23.4%, height: 13.1%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *conntile
          - type: state-label
            entity: binary_sensor.sovrum_x2d_firmware
            title: FIRMWARE
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 26.57%, top: 28.5%, width: 23.4%, height: 13.1%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *conntile
          - type: state-label
            entity: sensor.sovrum_x2d_mqtt_connection_mode
            title: MQTT
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 31.54%, top: 28.5%, width: 23.4%, height: 13.1%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *conntile

          - type: state-label
            entity: sensor.sovrum_x2d_ip_address
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 29.05%, top: 30.74%, width: 47.53%, height: 4.72%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                {% set ip = states(config.entity) %}
                {% set sn = states('sensor.sovrum_x2d_serial_number') %}
                {% set u = states('sensor.sovrum_x2d_total_usage') %}
                :host {
                  display: flex; align-items: center; justify-content: space-between;
                  box-sizing: border-box; padding: 0 1cqw;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0; line-height: 1; pointer-events: none;
                }
                div { display: none; }
                :host::before {
                  content: "IP {{ ip if ip not in ['unavailable', 'unknown'] else '--' }} · SN {{ sn if sn not in ['unavailable', 'unknown'] else '--' }}";
                  font-size: 1.4cqw; font-weight: 700; letter-spacing: 0.08cqw; color: #75787D; white-space: nowrap;
                }
                :host::after {
                  content: "DRIFTTID {{ (u | float(0)) | round(0) | int ~ ' h' if u | is_number else '--' }}";
                  font-size: 1.4cqw; font-weight: 700; letter-spacing: 0.08cqw; color: #75787D; white-space: nowrap;
                }

          # ============================================================
          # RAM G – PÅGÅENDE UTSKRIFT (x 402–1243 px, y 1692–2146 px)
          # ============================================================
          - type: state-label
