                  content: "{{ (pct | int ~ '%') if pct | is_number else '' }}";
                  font-size: 2.2cqw; font-weight: 800; white-space: nowrap;
                  color: {{ '#FF5A5A' if pct | is_number and pct | int < 15 else '#4CD685' }};
                }
          - type: state-label
            entity: sensor.sovrum_ams_2_pro_tray_2
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 43.1%, top: 20.94%, width: 12.5%, height: 17.35%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *spoollabel
          - type: state-label
            entity: sensor.sovrum_ams_2_pro_tray_3
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 46.74%, top: 20.94%, width: 12.5%, height: 17.35%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *spoollabel
          - type: state-label
            entity: sensor.sovrum_ams_2_pro_tray_4
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 50.52%, top: 20.94%, width: 12.5%, height: 17.35%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *spoollabel

          # ============================================================
          # ÖVER SKRIVAREN – skärmen: status, framsteg och lager
          # ============================================================
          - type: state-label
            entity: sensor.sovrum_x2d_print_status
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 41.41%, top: 36.78%, width: 24.74%, height: 12.07%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                {% set s = states(config.entity) %}
                {% set m = {'running': ('SKRIVER UT', '#4CD685'), 'prepare': ('FÖRBEREDER', '#4CD685'),
                            'slicing': ('SLICAR', '#4CD685'), 'init': ('STARTAR', '#4CD685'),
                            'pause': ('PAUSAD', '#4FB3E6'), 'failed': ('MISSLYCKAD', '#FF5A5A'),
                            'finish': ('KLAR', '#E3E1E2'), 'idle': ('INAKTIV', '#8A8F94'),
                            'offline': ('FRÅNKOPPLAD', '#8A8F94')} %}
                {% set txt, c = m.get(s, ('--', '#8A8F94')) %}
                {% set p = states('sensor.sovrum_x2d_print_progress') | int(0) %}
                {% set l = states('sensor.sovrum_x2d_current_layer') %}
                {% set lt = states('sensor.sovrum_x2d_total_layer_count') %}
                {% set rm = (states('sensor.sovrum_x2d_remaining_time') | float(0) * 60) | round(0) | int %}
                :host {
                  display: grid; grid-template-columns: 1fr auto; align-content: center;
                  row-gap: 3.2cqw; padding: 0 2cqw;
                  box-sizing: border-box;
                  background:
                    linear-gradient({{ c }}, {{ c }}) no-repeat 2cqw 50% / calc((100% - 4cqw) * {{ p / 100 }}) 0.8cqw,
                    linear-gradient(#2A2C2C, #2A2C2C) no-repeat 2cqw 50% / calc(100% - 4cqw) 0.8cqw;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0;
                  line-height: 1;
                  pointer-events: none;
                }
                :host::before {
                  content: "{{ txt }}";
                  font-size: 2.0cqw; font-weight: 900; letter-spacing: 0.05cqw;
                  color: {{ c }}; white-space: nowrap;
                }
                div { padding: 0; font-size: 0; }
                div::after {
                  content: "{{ p }}%";
                  font-size: 2.4cqw; font-weight: 900;
                  color: {{ c }}; white-space: nowrap;
                }
                :host::after {
                  content: "LAGER {{ l if l not in ['unavailable', 'unknown'] else 0 }} / {{ lt if lt not in ['unavailable', 'unknown'] else 0 }}   ⏱ {{ (rm // 60 ~ 'h ' if rm >= 60 else '') ~ (rm % 60) ~ 'm' }}";
                  grid-column: 1 / -1;
                  font-size: 1.6cqw; font-weight: 700; letter-spacing: 0.05cqw;
                  color: #A9ADB1; white-space: nowrap;
                }

          # Skärmens nedre rad: torkstatus (AMS) och kammarlampa
          - type: state-label
            entity: binary_sensor.sovrum_ams_2_pro_drying
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 41.41%, top: 38.78%, width: 24.74%, height: 5.66%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                {% set dry = is_state(config.entity, 'on') %}
                {% set dm = (states('sensor.sovrum_ams_2_pro_remaining_drying_time') | float(0) * 60) | round(0) | int %}
                {% set lamp = is_state('light.sovrum_x2d_chamber_light', 'on') %}
                :host {
                  display: flex; align-items: center; justify-content: space-between;
                  padding: 0 2cqw; box-sizing: border-box;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0; line-height: 1; pointer-events: none;
                }
                div { display: none; }
                :host::before {
                  content: "{{ ('TORKAR ' ~ ((dm // 60 ~ 'h ' if dm >= 60 else '') ~ (dm % 60) ~ 'm')) if dry else 'TORK AV' }}";
                  font-size: 1.6cqw; font-weight: 800; letter-spacing: 0.05cqw; white-space: nowrap;
                  color: {{ '#4CD685' if dry else '#8A8F94' }};
                }
                :host::after {
                  content: "LAMPA {{ 'PÅ' if lamp else 'AV' }}";
                  font-size: 1.6cqw; font-weight: 800; letter-spacing: 0.05cqw; white-space: nowrap;
                  color: {{ '#4CD685' if lamp else '#8A8F94' }};
                }

          # ============================================================
          # ÖVER SKRIVAREN – små temperaturetiketter (verktygshuvud, bädd, kammare)
          # ============================================================
          - type: state-label
            entity: sensor.sovrum_x2d_left_nozzle_temperature
            title: MUNSTYCKE V
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 41.15%, top: 43.65%, width: 18.25%, height: 10.93%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: &templabel |
                {% set v = states(config.entity) %}
                {% set ok = v not in ['unavailable', 'unknown'] %}
                {% set t = states(config.entity | replace('_temperature', '_target_temperature')) | float(0) %}
                :host {
                  display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 0.6cqw;
                  box-sizing: border-box;
                  background: rgba(20, 24, 22, 0.88);
                  border: 5px solid {{ '#FF5A5A' if not ok else ('#46624F' if t > 0 else '#3A3D3F') }};
                  border-radius: 1.6cqw;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0;
                  line-height: 1;
                  pointer-events: none;
                }
                div { padding: 0; font-size: 0; }
                div::after {
                  content: "{{ (v | float(0)) | round(0) | int ~ '°C' if ok else '--' }}";
                  font-size: 3.0cqw; font-weight: 800;
                  color: {{ '#FF5A5A' if not ok else ('#4CD685' if t > 0 else '#E3E1E2') }};
                  white-space: nowrap;
                }
                :host::after {
                  content: "{{ config.title }}";
                  font-size: 1.4cqw; font-weight: 700; letter-spacing: 0.08cqw;
                  color: #A9ADB1; white-space: nowrap;
                }
          - type: state-label
            entity: sensor.sovrum_x2d_right_nozzle_temperature
            title: MUNSTYCKE H
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 48.96%, top: 43.65%, width: 18.25%, height: 10.93%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *templabel
          - type: state-label
            entity: sensor.sovrum_x2d_bed_temperature
            title: BÄDD
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 44.58%, top: 52.32%, width: 18.25%, height: 10.93%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *templabel
          - type: state-label
            entity: sensor.sovrum_x2d_chamber_temperature
            title: KAMMARE
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 44.58%, top: 60.81%, width: 18.25%, height: 10.93%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: *templabel

          # ============================================================
          # RAM E – LIVEKAMERA (x 2581–3421 px, y 690–1306 px)
          # ============================================================
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: LIVEKAMERA
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 68.09%, top: 27.58%, transform: "translate(0, -50%) scale(0.2)", transform-origin: "left center"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "LIVEKAMERA";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 3.6cqw; font-weight: 900; letter-spacing: 0.15cqw;
                  color: #F3F4F8; white-space: nowrap;
                }
          - type: state-label
            entity: sensor.sovrum_x2d_printer_name
            title: X2D · LIVESTRÖM
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 68.09%, top: 28.87%, transform: "translate(0, -50%) scale(0.2)", transform-origin: "left center"}
            card_mod:
              style: |
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "X2D · LIVESTRÖM";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 1.6cqw; font-weight: 700; letter-spacing: 0.2cqw;
                  color: #75787D; white-space: nowrap;
                }
          - type: state-label
            entity: camera.sovrum_x2d_camera
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 88.22%, top: 27.58%, transform: "translate(-100%, -50%) scale(0.2)", transform-origin: "right center"}
            card_mod:
              style: |
                {% set on = states(config.entity) not in ['unavailable', 'unknown'] %}
                :host { font-size: 0; pointer-events: none; }
                div { display: none; }
                :host::after {
                  content: "{{ '● LIVE' if on else '● FRÅNKOPPLAD' }}";
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 2.0cqw; font-weight: 800; letter-spacing: 0.1cqw; white-space: nowrap;
                  color: {{ '#FF5A5A' if on else '#8A8F94' }};
                }
          - type: state-label
            entity: camera.sovrum_x2d_camera
            tap_action: {action: none}
            hold_action: {action: none}
            style: {left: 78.16%, top: 38.91%, width: 89.0%, height: 72.54%, transform: "translate(-50%, -50%) scale(0.2)"}
            card_mod:
              style: |
                {% set on = states(config.entity) not in ['unavailable', 'unknown'] %}
                :host {
                  display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 1.4cqw;
                  box-sizing: border-box;
                  background: #15181B;
                  border: 5px solid #2A2C2C;
                  border-radius: 2cqw;
                  font-family: Roboto, Inter, "Segoe UI", sans-serif;
                  font-size: 0;
                  line-height: 1;
                  pointer-events: none;
                }
                :host::before {
                  content: "{{ '' if on else 'KAMERA EJ TILLGÄNGLIG' }}";
                  font-size: 3.0cqw; font-weight: 800; letter-spacing: 0.1cqw;
                  color: #8A8F94; white-space: nowrap;
                }
                div { display: none; }
                :host::after {
                  content: "{{ '' if on else 'INGEN BILD FRÅN SKRIVAREN' }}";
                  font-size: 1.6cqw; font-weight: 700; letter-spacing: 0.1cqw;
                  color: #5B6064; white-space: nowrap;
                }
          - type: conditional
            conditions:
              - entity: camera.sovrum_x2d_camera
                state_not: unavailable
            elements:
              - type: image
                entity: camera.sovrum_x2d_camera
                camera_image: camera.sovrum_x2d_camera
                camera_view: live
                tap_action: {action: none}
                hold_action: {action: none}
                style: {left: 78.16%, top: 38.91%, width: 17.8%}
                card_mod:
                  style: |
                    :host { border-radius: 0.4cqw; overflow: hidden; }
